[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "media-agent"
version = "0.2.0"
description = "Organise a Plex media library on disk: normalise filenames, build indexes, enrich movies from TMDB."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "khalathas" }]
keywords = ["plex", "media", "library", "tmdb", "filename", "organiser"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: System :: Filesystems",
]
dependencies = [
    "requests>=2.31.0",
    "mutagen>=1.47.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
media-agent = "media_agent.cli:main"

[project.urls]
Homepage = "https://github.com/khalathas/media-agent"
Issues = "https://github.com/khalathas/media-agent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/media_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Matches the OS and Python classifiers advertised in pyproject.toml
        # -- if you add a classifier there, add it here too.
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -v

      - name: CLI smoke test (editable install)
        run: |
          media-agent --help
          python -m media_agent --help

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Install from wheel into a clean environment
        shell: bash
        run: |
          python -m venv wheel-test-env
          if [ -f wheel-test-env/bin/activate ]; then
            source wheel-test-env/bin/activate
          else
            source wheel-test-env/Scripts/activate
          fi
          pip install dist/*.whl

      - name: CLI smoke test (installed wheel)
        shell: bash
        run: |
          if [ -f wheel-test-env/bin/activate ]; then
            source wheel-test-env/bin/activate
          else
            source wheel-test-env/Scripts/activate
          fi
          media-agent --help
          python -m media_agent --help
